name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets you rebuild/re-publish an existing tag from the Actions tab or with:
  #   gh workflow run release.yml -f tag=v1.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and (re)publish, e.g. v1.0.0'
        required: true
        type: string

# Build jobs only need to read the repo; the release job is granted write below.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_script: build:linux
            artifact: linux
          - os: windows-latest
            build_script: build:win
            artifact: windows
          - os: macos-latest
            build_script: build:mac
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # `--publish never` is baked into the build scripts so electron-builder
      # never tries to upload on its own. The dedicated `release` job collects
      # every platform's installers and creates the GitHub Release exactly once.
      - run: npm run ${{ matrix.build_script }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-installers
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*-setup.exe
            dist/*.dmg
            dist/*.zip

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pull every platform's artifacts into one folder, then publish a single
      # release. Doing this in one job (instead of every matrix job) avoids the
      # concurrent uploads that previously triplicated the release notes.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
